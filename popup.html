<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GestureBackHistory</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header class="brand">
        <span class="brand-mark" aria-hidden="true">↔</span>
        <h1>GestureBackHistory</h1>
        <label class="switch" data-i18n-title="popupEnabled">
          <input id="enabled" type="checkbox">
          <span aria-hidden="true"></span>
          <span class="sr-only" data-i18n="popupEnabled"></span>
        </label>
      </header>

      <section class="row">
        <label for="gesture-direction" data-i18n="popupDirection"></label>
        <select id="gesture-direction">
          <option value="right" data-i18n="popupDirectionRight"></option>
          <option value="left" data-i18n="popupDirectionLeft"></option>
        </select>
      </section>

      <section class="row">
        <label for="language" data-i18n="popupLanguage"></label>
        <select id="language"></select>
      </section>

      <details class="advanced" id="advanced">
        <summary data-i18n="popupAdvanced"></summary>

        <section class="row">
          <label for="pull-distance" data-i18n="popupThreshold"></label>
          <select id="pull-distance"></select>
        </section>
      </details>

      <p class="notice" data-i18n="popupNotice"></p>
      <p id="status" class="status" role="status" aria-live="polite"></p>
    </main>
    <script src="shared/i18n.js"></script>
    <script src="shared/settings.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
