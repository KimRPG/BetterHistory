<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Better Gesture</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header class="brand">
        <!-- 툴바 아이콘과 같은 파일을 그대로 씁니다. 팝업에만 따로 그림을
             두면 아이콘을 바꿀 때 한쪽만 남습니다. 28px로 줄여 쓰지만 고해상도
             화면에서 뭉개지지 않도록 128px짜리를 가져옵니다. -->
        <img class="brand-mark" src="icons/icon128.png" alt="" width="28" height="28">
        <h1>Better Gesture</h1>
      </header>

      <section class="row" id="site-row">
        <span class="site-label">
          <span data-i18n="popupSite"></span>
          <span id="site-host" class="site-host"></span>
        </span>
        <label class="switch">
          <!-- 저장된 목록을 읽어 오기 전에 꺼진 채로 그려지면 켜져 있는
               사이트가 잠깐 꺼진 것처럼 보입니다. 대부분의 사이트가 켜져
               있으므로 켜 두고 시작하고 renderSite()가 고칩니다. -->
          <input id="site-enabled" type="checkbox" checked>
          <span aria-hidden="true"></span>
          <span class="sr-only" data-i18n="popupSite"></span>
        </label>
      </section>

      <section class="row">
        <label for="gesture-direction" data-i18n="popupDirection"></label>
        <select id="gesture-direction">
          <option value="right" data-i18n="popupDirectionRight"></option>
          <option value="left" data-i18n="popupDirectionLeft"></option>
        </select>
      </section>

      <section class="row">
        <span data-i18n="popupCloseOnDeadEnd"></span>
        <label class="switch">
          <!-- 켜진 것이 기본값입니다. 저장된 값을 읽기 전에 꺼진 채로 그려지면
               끈 적이 없는 사람에게 꺼진 것처럼 보입니다. -->
          <input id="close-on-dead-end" type="checkbox" checked>
          <span aria-hidden="true"></span>
          <span class="sr-only" data-i18n="popupCloseOnDeadEnd"></span>
        </label>
      </section>

      <section class="row">
        <label for="language" data-i18n="popupLanguage"></label>
        <select id="language"></select>
      </section>

      <section class="row stack">
        <span id="hold-still-label" data-i18n="popupThreshold"></span>
        <div
          id="hold-still"
          class="segmented"
          role="radiogroup"
          aria-labelledby="hold-still-label"
        ></div>
      </section>

      <p class="notice" data-i18n="popupNotice"></p>
      <p id="status" class="status" role="status" aria-live="polite"></p>
    </main>
    <script src="shared/i18n.js"></script>
    <script src="shared/settings.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
